name: publish

# Publishing a GitHub release uploads that version to PyPI. It uses PyPI's trusted publishing, so no
# token is stored anywhere: on pypi.org, add this repo and workflow (publish.yml, environment "pypi")
# as a trusted publisher for the chatdeck project once.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Check the version matches the release tag
        run: |
          v=$(PYTHONPATH=src python -c "import chatdeck; print(chatdeck.__version__)")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Release tag ${GITHUB_REF_NAME} but chatdeck.__version__ is $v"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
