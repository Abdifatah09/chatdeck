name: tests

on:
  push:
    branches: [main]   # branches are tested through their pull request, so each push runs once
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    # The name stays "test (ubuntu-latest, 3.9)" etc. because branch protection requires those checks by name.
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    # ubuntu-latest is Ubuntu 26.04, which has no Python 3.9 build, so 3.9 runs on 24.04.
    runs-on: ${{ (matrix.os == 'ubuntu-latest' && matrix.python == '3.9') && 'ubuntu-24.04' || matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Install and run the command
        run: |
          python -m pip install .
          chatdeck --version
          chatdeck --help
