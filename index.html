<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Chats</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#262a33;--text:#e6e8ee;--dim:#8b92a1;--green:#3ecf8e;--amber:#f5b942;--red:#f06a6a}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.4 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
header{padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:8px}h1{font-size:15px;margin:0;font-weight:600;flex:1}
.stats{color:var(--dim);font-size:12px;margin-top:4px}.stats b{color:var(--text)}
main{flex:1;overflow:auto;padding:12px 14px}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:4px 0 8px;font-weight:600;display:flex;align-items:center;gap:6px}
.btn{background:#222733;border:1px solid var(--line);color:var(--text);padding:3px 8px;border-radius:6px;cursor:pointer;font-size:12px;white-space:nowrap}
.btn:hover{border-color:#3a4150}.btn.danger{color:var(--red)}.btn:disabled{opacity:.4;cursor:default}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:7px}
.row{display:flex;align-items:center;gap:7px}.name{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}.dot.busy{background:var(--green);animation:p 1.6s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(62,207,142,.6)}70%{box-shadow:0 0 0 6px rgba(62,207,142,0)}100%{box-shadow:0 0 0 0 rgba(62,207,142,0)}}
.meta{color:var(--dim);font-size:11.5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:5px;background:#232733;border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%}
.ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}
.tool{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}input[type=search]{flex:1;min-width:120px;background:#14171d;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:4px 8px;font-size:12px}
.saved{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--line)}.saved:hover{background:#1a1e26}
.saved .txt{flex:1;min-width:0}.saved .name{font-weight:500}
#off{display:none;background:#3a1d1d;color:#ffb4b4;padding:6px 14px;font-size:12px}
#toast{position:fixed;bottom:12px;left:12px;right:12px;background:#24406b;padding:7px 10px;border-radius:7px;opacity:0;transition:.2s;pointer-events:none}#toast.on{opacity:1}
.empty{color:var(--dim);font-size:12px;padding:6px 2px}
.ugrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:8px}.tile{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.tile .v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}.tile .l{color:var(--dim);font-size:11px}
.chart{display:flex;align-items:flex-end;gap:5px;height:56px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px 18px;position:relative;margin-bottom:8px}
.chart div{flex:1;background:#4a7fd4;border-radius:3px 3px 0 0;position:relative;min-height:2px}.chart div.t{background:#7fb0ff}
.chart div span{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--dim)}
.lim{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px}.lim .bar{margin:4px 0 6px}
.proj{color:var(--dim);font-size:11.5px}.proj b{color:var(--text);font-weight:500}
</style></head><body>
<header><div class="top"><h1>Claude chats</h1><button class="btn" id="viewBtn" title="Open Claude's own sessions view">Agents view</button></div>
<div class="stats"><b id="nRun">–</b> running · <b id="nSaved">–</b> saved · open chats hold <b id="tok">–</b> tokens</div></header>
<div id="off">Dashboard server not reachable – retrying…</div>
<main><h2>Usage</h2><div id="usage"></div><h2 style="margin-top:14px">Running now</h2><div id="run"></div>
<h2 style="margin-top:14px">Saved chats</h2>
<div class="tool"><input type="search" id="q" placeholder="Search chats"><button class="btn danger" id="delSel" disabled>Delete selected</button><button class="btn" id="delEmpty"></button></div>
<div id="saved"></div></main><div id="toast"></div>
<script>
const TOKEN="__TOKEN__";const $=id=>document.getElementById(id);let S=[],sel=new Set(),now=Date.now()/1000;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago=t=>{const s=now-t;return s<60?"just now":s<3600?Math.round(s/60)+" min ago":s<86400?Math.round(s/3600)+" h ago":Math.round(s/86400)+" d ago"};
const k=n=>n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?Math.round(n/1e3)+"k":String(n);
const cls=n=>n<150e3?"ok":n<400e3?"warn":"bad";const col={ok:"var(--green)",warn:"var(--amber)",bad:"var(--red)"};
const toast=m=>{$("toast").textContent=m;$("toast").classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>$("toast").classList.remove("on"),2200)};
async function api(path,body){const ac=new AbortController();const to=setTimeout(()=>ac.abort(),body?45000:10000);const r=await fetch(path,{signal:ac.signal,method:body?"POST":"GET",headers:{"X-Token":TOKEN,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined}).finally(()=>clearTimeout(to));if(!r.ok)throw new Error(r.status);return r.json()}
function renderUsage(U){if(!U)return;const t=U.today,w=U.week_tot,fresh=a=>a[0]+a[1]+a[3];
  const max=Math.max(1,...U.week.map(x=>x[1]));const dn=d=>["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date(d+"T12:00").getDay()];
  let lim="";if(U.limits&&U.limits.data){const L=U.limits.data;const row=(label,o)=>{if(!o)return"";const pct=Math.round(o.used_percentage??o.utilization??o.percent??0);
    const rs=o.resets_at?new Date((typeof o.resets_at==="number"&&o.resets_at<1e12?o.resets_at*1000:o.resets_at)).toLocaleString([], {weekday:"short",hour:"2-digit",minute:"2-digit"}):"";
    return `<div class="row"><span style="flex:1">${label}</span><b class="${pct<60?"ok":pct<85?"warn":"bad"}">${pct}%</b></div><div class="bar"><i style="width:${pct}%;background:${col[pct<60?"ok":pct<85?"warn":"bad"]}"></i></div>${rs?`<div class="meta" style="margin:-3px 0 5px">resets ${esc(rs)}</div>`:""}`};
    lim=`<div class="lim">${row("5-hour limit",L.five_hour||L["5h"])}${row("Weekly limit",L.seven_day||L.weekly||L["7d"])}</div>`}
  else lim=`<div class="meta" style="margin-bottom:8px">Plan limits appear here once a Claude session updates its status line.</div>`;
  $("usage").innerHTML=`<div class="ugrid"><div class="tile"><div class="v">${k(fresh(t))}</div><div class="l">tokens today</div></div>
   <div class="tile"><div class="v">${k(fresh(w))}</div><div class="l">last 7 days</div></div>
   <div class="tile"><div class="v">${U.cost_24h?("$"+U.cost_24h.toFixed(2)):"–"}</div><div class="l">API-equivalent cost (24h)</div></div></div>
   ${lim}<div class="chart">${U.week.map((x,i)=>`<div class="${i===6?"t":""}" style="height:${Math.round(x[1]/max*100)}%" title="${k(x[1])} tokens"><span>${dn(x[0])}</span></div>`).join("")}</div>
   <div class="proj">Top this week: ${U.by_project.map(([p,n])=>`<b>${esc(p)}</b> ${k(n)}`).join(" · ")||"–"}</div>`}
function render(){
  const run=S.filter(x=>x.status),q=$("q").value.toLowerCase(),saved=S.filter(x=>!x.status&&(!q||(x.name+" "+x.cwd).toLowerCase().includes(q)));
  $("nRun").textContent=run.length;$("nSaved").textContent=S.filter(x=>!x.status).length;$("tok").textContent=k(run.reduce((a,x)=>a+x.ctx,0));
  $("run").innerHTML=run.length?run.map(x=>`<div class="card"><div class="row"><span class="dot ${x.status==="busy"?"busy":""}"></span><span class="name" title="${esc(x.name)}">${esc(x.name)}</span><button class="btn" data-orun="${x.sid}">Open</button><button class="btn danger" data-stop="${x.sid}">Stop</button></div>
   <div class="meta">${esc(x.cwd)} · ${x.status==="busy"?"working":"idle"} · ${esc(x.kind||"")} · ${x.msgs} msgs</div>
   <div class="bar"><i style="width:${Math.min(100,x.ctx/1e4)}%;background:${col[cls(x.ctx)]}"></i></div>
   <div class="meta"><b class="${cls(x.ctx)}">${k(x.ctx)} tokens</b>${x.ctx>=400e3?' · <span class="bad">expensive – type /compact or /clear in it</span>':x.ctx>=150e3?' · getting big':''}</div></div>`).join(""):'<div class="empty">No Claude sessions running.</div>';
  const empties=S.filter(x=>!x.status&&!x.msgs);$("delEmpty").textContent=`Delete ${empties.length} empty`;$("delEmpty").disabled=!empties.length;
  for(const s of [...sel]) if(!S.some(x=>x.sid===s&&!x.status)) sel.delete(s);
  $("delSel").disabled=!sel.size;$("delSel").textContent=sel.size?`Delete ${sel.size} selected`:"Delete selected";
  $("saved").innerHTML=saved.length?saved.map(x=>`<div class="saved"><input type="checkbox" data-sel="${x.sid}" ${sel.has(x.sid)?"checked":""}>
   <div class="txt"><div class="name" title="${esc(x.name)}">${esc(x.name)}</div><div class="meta">${esc(x.cwd||"–")} · ${x.msgs} msgs · ${(x.size/1048576).toFixed(1)} MB · ${ago(x.mtime)}</div></div>
   <button class="btn" data-open="${x.sid}">Resume</button><button class="btn danger" data-del="${x.sid}">Delete</button></div>`).join(""):'<div class="empty">No saved chats.</div>';
}
let lastSig="",lastDraw=0,pressing=false;
document.addEventListener("mousedown",()=>pressing=true,true);document.addEventListener("mouseup",()=>setTimeout(()=>pressing=false,300),true);
let inflight=false;
async function refresh(force){if(inflight&&!force)return;inflight=true;try{const d=await api("/api/state");$("off").style.display="none";
  const sig=JSON.stringify([d.chats.map(x=>[x.sid,x.name,x.status,x.ctx,x.msgs,x.size]),d.usage]);
  const stale=Date.now()-lastDraw>60000;  // refresh the "x min ago" labels once a minute
  if(force||sig!==lastSig||stale){ if(pressing&&!force) return; S=d.chats;now=d.now;lastSig=sig;lastDraw=Date.now();render();renderUsage(d.usage) }
 }catch(e){$("off").style.display="block"}finally{inflight=false}}
async function del(sids){if(!sids.length)return;if(!confirm(`Delete ${sids.length} saved chat${sids.length>1?"s":""} permanently?`))return;
  const r=await api("/api/delete",{sids});sids.forEach(s=>sel.delete(s));toast(`Deleted ${r.deleted.length}`+(r.refused.length?` · ${r.refused.length} skipped (running)`:""));refresh(true)}
document.addEventListener("click",async e=>{const t=e.target,d=t.dataset;try{
  if(d.stop){const x=S.find(s=>s.sid===d.stop);if(confirm(`Stop "${x?x.name:"this session"}"? Unsaved work in progress will be interrupted.`)){const r=await api("/api/stop",{sid:d.stop});toast(r.ok?"Stopped":"Couldn't stop: "+r.error);setTimeout(()=>refresh(true),1500)}}
  else if(d.orun){toast("Opening…");const r=await api("/api/open-running",{sid:d.orun});toast(r.ok?"Opened – "+r.how:"Couldn't open: "+r.error)}
  else if(d.open){await api("/api/open",{sid:d.open});toast("Opening in a new terminal tab…")}
  else if(d.del){await del([d.del])}
  else if(t.id==="delSel"){await del([...sel])}
  else if(t.id==="delEmpty"){await del(S.filter(x=>!x.status&&!x.msgs).map(x=>x.sid))}
  else if(t.id==="viewBtn"){await api("/api/open",{view:true});toast("Opening agents view…")}
}catch(err){toast("Something went wrong: "+err.message)}});
document.addEventListener("change",e=>{const s=e.target.dataset.sel;if(s){e.target.checked?sel.add(s):sel.delete(s);render()}});
$("q").addEventListener("input",render);refresh(true);setInterval(refresh,4000);
</script></body></html>
