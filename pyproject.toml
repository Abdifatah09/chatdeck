[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatdeck"
dynamic = ["version"]
description = "A local dashboard for your Claude Code chats: what's running, what needs you, and what it costs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
keywords = ["claude", "claude-code", "dashboard", "ai", "cli"]
classifiers = [
  "Environment :: Console",
  "Environment :: Web Environment",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.scripts]
chatdeck = "chatdeck.cli:main"

[tool.setuptools.dynamic]
version = { attr = "chatdeck.__version__" }

[tool.setuptools.package-data]
chatdeck = ["static/*", "windows/*"]
